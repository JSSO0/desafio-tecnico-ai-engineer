name: emporio-da-musica

services:
  api:
    build: .
    image: emporio-agent-api:local
    env_file:
      - .env
    environment:
      APP_ENV: docker
      DATABASE_PATH: /data/loja.db
      LOGS_DIR: /app/logs
    ports:
      - "8000:8000"
    volumes:
      - appdata:/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  appdata:
