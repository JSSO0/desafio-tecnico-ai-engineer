server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # arquivos estáticos: cache curto em dev, sem esconder erro de digitação
    location / {
        try_files $uri $uri/ /index.html;
    }

    # mesma origem para a API: quando a UI é servida daqui, não existe CORS.
    # Serve também para quem abrir a interface em outra máquina e não puder
    # alcançar localhost:8000 do host.
    location ~ ^/(v1|healthz|readyz|docs|redoc|openapi\.json) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # sem isto o nginx acumula o corpo e o streaming do chat para de ser streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
